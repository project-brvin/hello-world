name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hello-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is reproducible
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Wrangler dry run
        run: npm run check

  deploy:
    name: Deploy production Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          persist-credentials: false
      - name: Apply long-term memory schema
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: d1 migrations apply hello-world-memory --remote
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy
      - name: Verify production health and homepage
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 https://hello-world.projectbrvin.workers.dev/health)"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            if (value.status !== "ok" || value.service !== "hello-world" || !value.version) throw new Error("Health contract failed");
            console.log(JSON.stringify({ smoke_test: "health", version: value.version }));
          ' "$health"
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 https://hello-world.projectbrvin.workers.dev/)"
          grep -Fq "What can I help with?" <<< "$page"
          echo "Homepage smoke test passed."
      - name: Verify AI status and security headers
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 https://hello-world.projectbrvin.workers.dev/api/status)"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            if (typeof value.provider !== "string" || typeof value.model !== "string" ||
                typeof value.configured !== "boolean" || typeof value.ready !== "boolean" ||
                !Array.isArray(value.providers) || !value.voice ||
                value.voice.input !== "browser-speech-recognition" ||
                value.voice.output !== "browser-speech-synthesis" ||
                value.sessionOrchestrator !== true || value.durableMemory !== true) {
              throw new Error("AI, Durable Object, D1, and voice status contract failed");
            }
            if (value.providers.some((provider) => !["Groq", "FreeLLMAPI"].includes(provider.id)) ||
                value.providers.some((provider) => /key|secret|token/i.test(JSON.stringify(provider)))) {
              throw new Error("AI status returned an unexpected provider or sensitive field");
            }
            if (Object.keys(value).some((key) => /key|secret|token/i.test(key))) {
              throw new Error("AI status leaked a sensitive field");
            }
            console.log(JSON.stringify({ smoke_test: "ai-status", providers: value.providers.map((provider) => provider.id), ready: value.ready, voice: value.voice.persistentSession }));
          ' "$status"
          headers="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 -D - -o /dev/null https://hello-world.projectbrvin.workers.dev/)"
          node --input-type=module -e '
            const headers = process.argv[1].toLowerCase();
            if (!/^x-content-type-options:\\s*nosniff\\s*$/m.test(headers)) throw new Error("X-Content-Type-Options header missing");
            if (!/^content-security-policy:\\s*.+$/m.test(headers)) throw new Error("Content-Security-Policy header missing");
            if (!/^content-security-policy:.*connect-src[^\\r\\n]*wss:/m.test(headers)) throw new Error("CSP does not allow same-origin secure WebSockets");
            console.log("Homepage security headers and WebSocket CSP passed.");
          ' "$headers"
