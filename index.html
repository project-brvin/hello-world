<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A clean, ChatGPT-inspired chat interface demo.">
  <title>ChatGPT — Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --sidebar: #f9f9f9;
      --panel: #ffffff;
      --text: #0d0d0d;
      --muted: #777777;
      --soft: #ececec;
      --soft-hover: #e5e5e5;
      --line: #e8e8e8;
      --composer: #ffffff;
      --shadow: 0 8px 28px rgba(0,0,0,.08);
      --accent: #10a37f;
      --user: #f4f4f4;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #212121;
      --sidebar: #171717;
      --panel: #212121;
      --text: #ececec;
      --muted: #a0a0a0;
      --soft: #303030;
      --soft-hover: #3a3a3a;
      --line: #343434;
      --composer: #303030;
      --shadow: 0 8px 28px rgba(0,0,0,.25);
      --user: #303030;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar {
      position: relative;
      z-index: 5;
      display: flex;
      width: 260px;
      min-width: 260px;
      flex-direction: column;
      gap: 18px;
      padding: 14px 12px 12px;
      background: var(--sidebar);
      transition: transform .22s ease, width .22s ease;
    }
    .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 7px; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); }
    .brand-mark svg { width: 20px; height: 20px; }
    .icon-btn {
      display: inline-grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background .15s ease;
    }
    .icon-btn:hover, .side-action:hover, .history-item:hover { background: var(--soft-hover); }
    .icon-btn svg, .side-action svg, .send-btn svg, .tool-btn svg, .brand-mark svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .side-action {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }
    .side-action.primary { border: 1px solid var(--line); background: var(--panel); }
    .side-action svg { width: 18px; height: 18px; }
    .history-label { padding: 14px 10px 5px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .history { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 3px; overflow: auto; }
    .history-item {
      display: flex;
      min-height: 38px;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      overflow: hidden;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 12.5px;
      cursor: pointer;
    }
    .history-item.active { background: var(--soft); }
    .history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--muted); }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px 5px;
      border-top: 1px solid var(--line);
    }
    .avatar { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #7b66ad; color: white; font-size: 12px; font-weight: 650; }
    .profile-copy { min-width: 0; flex: 1; }
    .profile-copy strong { display: block; font-size: 12px; font-weight: 600; }
    .profile-copy small { color: var(--muted); font-size: 11px; }
    .main { position: relative; display: flex; min-width: 0; flex: 1; flex-direction: column; background: var(--bg); }
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      height: 58px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: var(--bg);
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; }
    .mobile-menu { display: none; }
    .product-name { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 650; letter-spacing: -.035em; }
    .product-name .chevron { width: 14px; height: 14px; color: var(--muted); }
    .demo-pill { padding: 4px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .top-link { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); font-size: 12px; font-weight: 550; cursor: pointer; }
    .top-link:hover { background: var(--soft); }
    .top-link svg { width: 15px; height: 15px; }
    .content { position: relative; display: flex; min-height: 0; flex: 1; flex-direction: column; }
    .welcome {
      display: flex;
      width: min(100% - 36px, 760px);
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      align-self: center;
      padding: 20px 0 12px;
    }
    .welcome h1 { margin: 0 0 34px; font-size: clamp(27px, 3vw, 34px); font-weight: 570; letter-spacing: -.055em; line-height: 1.2; text-align: center; }
    .prompt-grid { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 17px; }
    .prompt-card {
      display: flex;
      min-height: 64px;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .prompt-card:hover { border-color: #c9c9c9; background: var(--soft); transform: translateY(-1px); }
    .prompt-icon { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 9px; background: var(--soft); color: var(--muted); }
    .prompt-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .prompt-copy strong { display: block; font-size: 12px; font-weight: 600; }
    .prompt-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .composer-wrap { width: min(100% - 36px, 760px); align-self: center; padding: 8px 0 13px; }
    .composer {
      position: relative;
      display: flex;
      min-height: 58px;
      align-items: flex-end;
      gap: 9px;
      padding: 10px 12px;
      border: 1px solid #d8d8d8;
      border-radius: 28px;
      background: var(--composer);
      box-shadow: var(--shadow);
    }
    [data-theme="dark"] .composer { border-color: #454545; }
    .composer:focus-within { border-color: #b9b9b9; }
    .add-btn { width: 34px; height: 34px; margin-bottom: 1px; border-radius: 50%; color: var(--muted); }
    .add-btn svg { width: 20px; height: 20px; }
    .message-input {
      display: block;
      width: 100%;
      max-height: 180px;
      min-height: 35px;
      flex: 1;
      resize: none;
      padding: 7px 0 5px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .message-input::placeholder { color: #8b8b8b; }
    .send-btn {
      display: grid;
      width: 35px;
      height: 35px;
      flex: 0 0 auto;
      place-items: center;
      margin-bottom: 0;
      border: 0;
      border-radius: 50%;
      background: #0d0d0d;
      color: white;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
    }
    .send-btn:disabled { opacity: .24; cursor: default; }
    .send-btn:not(:disabled):hover { transform: scale(1.04); }
    .send-btn svg { width: 18px; height: 18px; stroke-width: 2.2; }
    .composer-hint { margin: 9px 0 0; color: var(--muted); font-size: 10.5px; text-align: center; }
    .chat-view { display: none; width: 100%; min-height: 0; flex: 1; flex-direction: column; }
    .messages { width: min(100% - 36px, 760px); min-height: 0; flex: 1; align-self: center; overflow-y: auto; padding: 22px 0 30px; scroll-behavior: smooth; }
    .message-row { display: flex; gap: 14px; margin: 0 0 25px; align-items: flex-start; }
    .message-row.user { justify-content: flex-end; }
    .message-body { max-width: min(88%, 650px); min-width: 0; font-size: 14px; line-height: 1.72; overflow-wrap: anywhere; }
    .user-bubble { padding: 10px 16px; border-radius: 22px; background: var(--user); }
    .assistant-mark { display: grid; width: 29px; height: 29px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); }
    .assistant-mark svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.65; }
    .assistant-copy { padding-top: 2px; white-space: pre-wrap; }
    .assistant-copy p { margin: 0 0 10px; }
    .assistant-copy p:last-child { margin-bottom: 0; }
    .assistant-actions { display: flex; gap: 3px; margin-top: 9px; }
    .assistant-actions button { display: inline-grid; width: 29px; height: 29px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
    .assistant-actions button:hover { background: var(--soft); color: var(--text); }
    .assistant-actions svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chat-composer-wrap { width: min(100% - 36px, 760px); align-self: center; padding: 8px 0 11px; background: var(--bg); }
    .chat-composer-wrap .composer { box-shadow: 0 5px 22px rgba(0,0,0,.055); }
    .chat-note { margin: 8px 0 0; color: var(--muted); font-size: 10.5px; text-align: center; }
    .mobile-backdrop { display: none; }
    .toast {
      position: absolute;
      z-index: 10;
      bottom: 88px;
      left: 50%;
      max-width: calc(100% - 30px);
      padding: 9px 13px;
      transform: translateX(-50%);
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 760px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 275px; transform: translateX(-102%); box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-backdrop.show { position: fixed; z-index: 4; inset: 0; display: block; background: rgba(0,0,0,.25); }
      .mobile-menu { display: inline-grid; }
      .topbar { height: 55px; padding: 0 12px; }
      .top-right .top-link { padding: 8px; }
      .top-right .top-link span { display: none; }
      .welcome { width: min(100% - 28px, 560px); justify-content: center; padding-top: 8px; }
      .welcome h1 { margin-bottom: 25px; }
      .composer-wrap, .chat-composer-wrap { width: calc(100% - 24px); }
      .messages { width: calc(100% - 28px); padding-top: 17px; }
      .prompt-grid { gap: 8px; }
      .prompt-card { min-height: 62px; padding: 10px; gap: 8px; }
      .prompt-copy small { font-size: 10px; }
    }
    @media (max-width: 420px) {
      .prompt-grid { grid-template-columns: 1fr; }
      .prompt-card { min-height: 54px; }
      .welcome h1 { font-size: 27px; }
      .demo-pill { display: none; }
      .message-body { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <div class="brand-mark" aria-label="ChatGPT demo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a4.4 4.4 0 0 0-4.1 2.8 4.2 4.2 0 0 0-3.3 6.2 4.3 4.3 0 0 0 2.1 6.9 4.4 4.4 0 0 0 7.1 1.1 4.2 4.2 0 0 0 7.2-4.3 4.3 4.3 0 0 0 .1-7.1 4.4 4.4 0 0 0-5.1-5.4A4.3 4.3 0 0 0 12 3.2Z"/><path d="m8 6.3 8.1 4.6v5.2M4.6 12.2l8.1 4.7 4.6-2.7M7 19.1l.1-9.3 4.5-2.6M19.4 8.8l-8.1 4.7v5.2"/></svg>
        </div>
        <button class="icon-btn" id="collapse-sidebar" aria-label="Close sidebar" title="Close sidebar">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <button class="side-action primary" id="new-chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span>
      </button>
      <button class="side-action" id="search-history">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><span>Search chats</span>
      </button>
      <input id="history-search-input" aria-label="Search chats" placeholder="Search your chats" style="display:none;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;font-size:12px">
      <div class="history-label">Your chats</div>
      <div class="history" id="history"></div>
      <div class="profile">
        <div class="avatar">Y</div>
        <div class="profile-copy"><strong>You</strong><small>Personal workspace</small></div>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg>
        </button>
      </div>
    </aside>
    <div class="mobile-backdrop" id="backdrop"></div>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn mobile-menu" id="open-sidebar" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="product-name">ChatGPT <svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></div>
          <span class="demo-pill">UI demo</span>
        </div>
        <div class="top-right">
          <button class="top-link" id="share-button" title="Share this demo">
            <svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>Share</span>
          </button>
        </div>
      </header>
      <section class="content">
        <section class="welcome" id="welcome">
          <h1>What can I help with?</h1>
          <div class="composer-wrap">
            <form class="composer" id="welcome-form">
              <button class="icon-btn add-btn" type="button" id="attach-welcome" aria-label="Attach a file" title="Attach a file">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <textarea class="message-input" id="welcome-input" rows="1" maxlength="4000" placeholder="Message ChatGPT..." aria-label="Message ChatGPT"></textarea>
              <button class="send-btn" id="welcome-send" type="submit" disabled aria-label="Send message">
                <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </form>
            <div class="prompt-grid">
              <button class="prompt-card" data-prompt="Help me plan a productive week.">
                <span class="prompt-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h2m3 0h2"/></svg></span>
                <span class="prompt-copy"><strong>Make a plan</strong><small>Organize my week</small></span>
              </button>
              <button class="prompt-card" data-prompt="Explain a complex topic in simple terms.">
                <span class="prompt-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.6 1.3c-.8 1.1-2.2 1.4-2.2 3.2m0 3h.01"/></svg></span>
                <span class="prompt-copy"><strong>Explain something</strong><small>Make it easy to understand</small></span>
              </button>
              <button class="prompt-card" data-prompt="Help me write a clear, friendly message.">
                <span class="prompt-icon"><svg viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg></span>
                <span class="prompt-copy"><strong>Write something</strong><small>Draft or polish text</small></span>
              </button>
              <button class="prompt-card" data-prompt="Give me some creative ideas for a new project.">
                <span class="prompt-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8h6c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2Z"/></svg></span>
                <span class="prompt-copy"><strong>Brainstorm ideas</strong><small>Explore something new</small></span>
              </button>
            </div>
          </div>
        </section>
        <section class="chat-view" id="chat-view">
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="chat-composer-wrap">
            <form class="composer" id="chat-form">
              <button class="icon-btn add-btn" type="button" id="attach-chat" aria-label="Attach a file" title="Attach a file">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <textarea class="message-input" id="chat-input" rows="1" maxlength="4000" placeholder="Message ChatGPT..." aria-label="Message ChatGPT"></textarea>
              <button class="send-btn" id="chat-send" type="submit" disabled aria-label="Send message">
                <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </form>
            <p class="chat-note">Demo replies are generated locally. This page is not connected to an AI model.</p>
          </div>
        </section>
        <input type="file" id="file-input" hidden multiple>
        <div class="toast" id="toast" role="status"></div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const $ = function (id) { return document.getElementById(id); };
      const sidebar = $('sidebar'), backdrop = $('backdrop'), welcome = $('welcome'), chatView = $('chat-view');
      const historyEl = $('history'), messagesEl = $('messages'), toastEl = $('toast');
      const welcomeInput = $('welcome-input'), chatInput = $('chat-input');
      const fileInput = $('file-input');
      let conversations = [];
      let activeId = null;
      let toastTimer = null;
      try { conversations = JSON.parse(localStorage.getItem('chatgpt-ui-demo-chats') || '[]'); } catch (e) { conversations = []; }
      if (!Array.isArray(conversations)) conversations = [];

      function save() {
        try { localStorage.setItem('chatgpt-ui-demo-chats', JSON.stringify(conversations)); } catch (e) {}
      }
      function notify(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
      }
      function newId() { return String(Date.now()) + String(Math.floor(Math.random() * 1000)); }
      function activeConversation() { return conversations.find(function (c) { return c.id === activeId; }); }
      function setView(isChat) {
        welcome.style.display = isChat ? 'none' : 'flex';
        chatView.style.display = isChat ? 'flex' : 'none';
        if (!isChat) { welcomeInput.focus({ preventScroll: true }); }
      }
      function renderHistory() {
        const query = ($('history-search-input').value || '').toLowerCase().trim();
        historyEl.innerHTML = '';
        const sorted = conversations.slice().reverse().filter(function (c) { return !query || c.title.toLowerCase().includes(query); });
        sorted.forEach(function (c) {
          const b = document.createElement('button');
          b.className = 'history-item' + (c.id === activeId ? ' active' : '');
          b.type = 'button';
          b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H9l-5 4v-15.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span></span>';
          b.querySelector('span').textContent = c.title;
          b.addEventListener('click', function () { activeId = c.id; renderChat(); closeSidebar(); });
          historyEl.appendChild(b);
        });
        if (!sorted.length) {
          const empty = document.createElement('div');
          empty.style.cssText = 'padding:10px;color:var(--muted);font-size:11px';
          empty.textContent = query ? 'No matching chats' : 'Your conversations will appear here';
          historyEl.appendChild(empty);
        }
      }
      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, function (ch) {
          return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch];
        });
      }
      function assistantIcon() {
        return '<div class="assistant-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2a4.4 4.4 0 0 0-4.1 2.8 4.2 4.2 0 0 0-3.3 6.2 4.3 4.3 0 0 0 2.1 6.9 4.4 4.4 0 0 0 7.1 1.1 4.2 4.2 0 0 0 7.2-4.3 4.3 4.3 0 0 0 .1-7.1 4.4 4.4 0 0 0-5.1-5.4A4.3 4.3 0 0 0 12 3.2Z"/></svg></div>';
      }
      function renderChat() {
        const c = activeConversation();
        if (!c) { activeId = null; setView(false); renderHistory(); return; }
        setView(true);
        messagesEl.innerHTML = '';
        c.messages.forEach(function (m, index) {
          const row = document.createElement('div');
          row.className = 'message-row ' + (m.role === 'user' ? 'user' : 'assistant');
          if (m.role === 'user') {
            row.innerHTML = '<div class="message-body user-bubble"></div>';
            row.querySelector('.message-body').textContent = m.text;
          } else {
            row.innerHTML = assistantIcon() + '<div class="message-body"><div class="assistant-copy"></div><div class="assistant-actions"><button type="button" title="Copy response" aria-label="Copy response"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div></div>';
            row.querySelector('.assistant-copy').textContent = m.text;
            row.querySelector('button').addEventListener('click', function () {
              copyText(m.text);
            });
          }
          messagesEl.appendChild(row);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
        renderHistory();
      }
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { notify('Copied to clipboard'); }).catch(function () { notify('Clipboard access is unavailable'); });
        } else { notify('Clipboard access is unavailable'); }
      }
      function demoReply(userText) {
        const t = userText.toLowerCase();
        if (t.includes('hello') || t.includes('hi ') || t === 'hi' || t.includes('hey')) {
          return 'Hello! 👋\\n\\nYou’re chatting inside a working ChatGPT-inspired interface. Try the sidebar, start a new conversation, switch themes, or send another message.';
        }
        if (t.includes('plan') || t.includes('week') || t.includes('schedule')) {
          return 'Here’s a simple way to get started:\\n\\n1. Pick your three most important outcomes.\\n2. Block focused time for the hardest task first.\\n3. Group small errands into one slot.\\n4. Leave some breathing room for surprises.\\n\\nTell me your priorities and I can help shape a more detailed example. (This demo response is local, not AI-generated.)';
        }
        if (t.includes('write') || t.includes('draft') || t.includes('message')) {
          return 'Absolutely — a useful writing brief includes the audience, the main point, and the tone you want.\\n\\nShare those details and I can help you structure a draft. In this preview, replies are fixed demo examples rather than responses from an AI model.';
        }
        if (t.includes('explain') || t.includes('learn') || t.includes('what is')) {
          return 'A good explanation starts with the core idea, then adds a simple example, and finally covers the details.\\n\\nThis interface is only a front-end demonstration: it does not send your message to an AI service. Connect a secure backend to add real model responses.';
        }
        return 'Thanks for trying the demo. Your message was added to this conversation and saved in this browser.\\n\\nThis is a front-end-only preview, so I’m not connected to an AI model yet. To make it truly conversational, connect a server-side API endpoint and keep any API key on the server — never in browser JavaScript.';
      }
      function addMessage(text) {
        const clean = text.trim();
        if (!clean) return;
        let c = activeConversation();
        if (!c) {
          c = { id: newId(), title: clean.slice(0, 34) + (clean.length > 34 ? '…' : ''), messages: [], created: Date.now() };
          conversations.push(c);
          activeId = c.id;
        }
        c.messages.push({ role: 'user', text: clean });
        c.messages.push({ role: 'assistant', text: demoReply(clean) });
        save();
        renderChat();
      }
      function newChat() {
        activeId = null;
        welcomeInput.value = '';
        chatInput.value = '';
        resizeInput(welcomeInput);
        resizeInput(chatInput);
        setView(false);
        renderHistory();
        closeSidebar();
      }
      function submit(input) {
        const text = input.value;
        if (!text.trim()) return;
        addMessage(text);
        input.value = '';
        resizeInput(input);
        updateSendButtons();
      }
      function resizeInput(input) {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      }
      function updateSendButtons() {
        $('welcome-send').disabled = !welcomeInput.value.trim();
        $('chat-send').disabled = !chatInput.value.trim();
      }
      function openSidebar() { sidebar.classList.add('open'); backdrop.classList.add('show'); }
      function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
      function bindComposer(input, form) {
        input.addEventListener('input', function () { resizeInput(input); updateSendButtons(); });
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            if (input.value.trim()) form.requestSubmit();
          }
        });
        form.addEventListener('submit', function (event) { event.preventDefault(); submit(input); });
      }
      bindComposer(welcomeInput, $('welcome-form'));
      bindComposer(chatInput, $('chat-form'));
      $('new-chat').addEventListener('click', newChat);
      $('collapse-sidebar').addEventListener('click', closeSidebar);
      $('open-sidebar').addEventListener('click', openSidebar);
      backdrop.addEventListener('click', closeSidebar);
      document.querySelectorAll('[data-prompt]').forEach(function (button) {
        button.addEventListener('click', function () { welcomeInput.value = button.getAttribute('data-prompt'); resizeInput(welcomeInput); updateSendButtons(); welcomeInput.focus(); });
      });
      $('search-history').addEventListener('click', function () {
        const field = $('history-search-input');
        field.style.display = field.style.display === 'none' ? 'block' : 'none';
        if (field.style.display === 'block') field.focus();
        else { field.value = ''; renderHistory(); }
      });
      $('history-search-input').addEventListener('input', renderHistory);
      $('theme-toggle').addEventListener('click', function () {
        const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('chatgpt-ui-demo-theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
      try { if (localStorage.getItem('chatgpt-ui-demo-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
      function pickFile() { fileInput.click(); }
      $('attach-welcome').addEventListener('click', pickFile);
      $('attach-chat').addEventListener('click', pickFile);
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files.length) notify(fileInput.files.length + ' file(s) selected — uploads are not enabled in this demo');
        fileInput.value = '';
      });
      $('share-button').addEventListener('click', function () {
        if (navigator.share) navigator.share({ title: 'ChatGPT UI demo', url: location.href }).catch(function () {});
        else copyText(location.href);
      });
      conversations.sort(function (a, b) { return (a.created || 0) - (b.created || 0); });
      renderHistory();
      setView(false);
      updateSendButtons();
    })();
  </script>
</body>
</html>
